<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Itineraries">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest?v=4">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css?v=4">
<title>Itineraries</title>
</head><body>
<section id="login" class="screen" hidden>
  <form id="loginForm" class="card login">
    <h1>Itineraries</h1>
    <label>Username<input id="lu" autocomplete="username" autocapitalize="none" required></label>
    <label>Password<input id="lp" type="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
    <p id="loginErr" class="err"></p>
  </form>
</section>
<section id="list" class="screen">
  <header class="bar"><h1>Itineraries</h1><span id="updated" class="muted"></span>
    <button id="logout" class="pill" hidden>Sign out</button>
    <button id="refresh" class="icon" aria-label="Refresh">&#x21bb;</button></header>
  <main id="items"></main>
</section>
<section id="viewer" class="screen" hidden>
  <header class="bar vbar">
    <button id="back" class="icon" aria-label="Back">&#x2039;</button>
    <div class="vtitle"><div id="vname"></div><div id="vsub" class="muted"></div></div>
    <button id="vpdf" class="pill" hidden>View PDF</button>
    <button id="vlist" class="pill" hidden>List</button>
    <button id="zout" class="icon" aria-label="Zoom out">&minus;</button>
    <button id="zfit" class="pill" aria-label="Fit width">Fit</button>
    <button id="zin" class="icon" aria-label="Zoom in">+</button>
    <button id="share" class="icon" aria-label="Share or download">&#x2191;</button>
  </header>
  <main id="stops" hidden></main>
  <div id="pages"><div id="pagewrap"></div></div>
</section>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="data-adapter.js"></script>
<script type="module" src="app.js?v=4"></script>
</body></html>
